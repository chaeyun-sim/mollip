<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<title>홈 H2 출발 안내판 다크 미니멀</title>
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<link
					rel="stylesheet"
					href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&amp;display=swap"
				/>
				<style>
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/7977b3ca42ace65d7e67bd031fe90ded') format('opentype');
						font-weight: 400;
					}
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/8f065eca601ce3cb85348621e7b4c825') format('opentype');
						font-weight: 500;
					}
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/7a9653a1bcd0948efd3d3730b1362841') format('opentype');
						font-weight: 600;
					}
					body {
						margin: 0;
					}
					a {
						color: #f8f6f2;
						text-decoration: none;
					}
					a:hover {
						color: #e8e8e8;
					}
				</style>
			</helmet>
			<div
				style="
					width: 390px;
					height: 844px;
					box-sizing: border-box;
					background: #f8f6f2;
					color: #1c1917;
					font-family: 'Pretendard', sans-serif;
					position: relative;
					display: flex;
					flex-direction: column;
					overflow: hidden;
				"
			>
				<header
					style="
						display: flex;
						justify-content: space-between;
						align-items: center;
						padding: 56px 20px 0 24px;
					"
				>
					<div
						style="
							font-family: 'Hahmlet', serif;
							font-weight: 700;
							font-size: 26px;
							letter-spacing: -0.5px;
						"
					>
						mollip
					</div>
					<div style="display: flex; gap: 8px">
						<button
							aria-label="북마크"
							style="
								width: 44px;
								height: 44px;
								border: 0;
								background: transparent;
								padding: 0;
								display: flex;
								align-items: center;
								justify-content: center;
							"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#1C1917"
								stroke-width="1.6"
							>
								<path d="M6 3h12v18l-6-4-6 4z" />
							</svg>
						</button>
						<button
							aria-label="알림"
							style="
								width: 44px;
								height: 44px;
								border: 0;
								background: transparent;
								padding: 0;
								display: flex;
								align-items: center;
								justify-content: center;
							"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#1C1917"
								stroke-width="1.6"
							>
								<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z" />
								<path d="M10 21h4" />
							</svg>
						</button>
					</div>
				</header>

				<section
					style="
						margin: 24px 16px 0 16px;
						background: #1c1917;
						border-radius: 20px;
						padding: 24px 20px 10px 20px;
						color: #f8f6f2;
					"
				>
					<div
						style="
							display: flex;
							justify-content: space-between;
							align-items: baseline;
							margin-bottom: 14px;
						"
					>
						<span style="font-family: 'Hahmlet', serif; font-weight: 600; font-size: 19px"
							>곧 떠나는 전시</span
						>
						<span style="font-size: 12px; color: #78716c; font-variant-numeric: tabular-nums"
							>17:42</span
						>
					</div>
					<sc-for list="{{board}}" as="r" hint-placeholder-count="5">
						<a
							href="#"
							style="
								display: flex;
								align-items: center;
								gap: 16px;
								padding: 14px 0;
								border-top: 0.5px solid #292524;
							"
						>
							<span style="width: 70px; display: flex; gap: 2px; flex-shrink: 0">
								<sc-for list="{{r.chars}}" as="ch" hint-placeholder-count="5">
									<span
										style="width: 12px; height: 22px; border-radius: 2px; background: {{r.tileBg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; background-image: linear-gradient(transparent 49%, #1C1917 49%, #1C1917 52%, transparent 52%)"
										>{{ch}}</span
									>
								</sc-for>
							</span>
							<span
								style="
									flex: 1;
									min-width: 0;
									font-size: 15px;
									font-weight: 500;
									white-space: nowrap;
									overflow: hidden;
									text-overflow: ellipsis;
								"
								>{{r.title}}</span
							>
							<span
								style="width: 6px; height: 6px; border-radius: 999px; background: {{r.dot}}; flex-shrink: 0"
							></span>
						</a>
					</sc-for>
				</section>

				<button
					style="
						position: absolute;
						right: 20px;
						bottom: 100px;
						height: 52px;
						padding: 0 20px;
						border: 0;
						border-radius: 999px;
						background: #1c1917;
						color: #ffffff;
						font-family: 'Pretendard', sans-serif;
						font-size: 15px;
						font-weight: 600;
						display: flex;
						align-items: center;
						gap: 8px;
						box-shadow: 0 6px 14px rgba(28, 25, 23, 0.28);
					"
				>
					<svg
						width="20"
						height="20"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#FFFFFF"
						stroke-width="1.8"
					>
						<path d="M4 8h3l2-3h6l2 3h3v11H4z" />
						<circle cx="12" cy="13" r="3.5" />
					</svg>
					AI 도슨트
				</button>

				<footer
					style="
						position: absolute;
						left: 0;
						right: 0;
						bottom: 0;
						height: 84px;
						background: #ffffff;
						border-top: 0.5px solid #e7e5e4;
						display: grid;
						grid-template-columns: repeat(5, minmax(0, 1fr));
						padding-top: 12px;
						box-sizing: border-box;
					"
				>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">전시</span>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">지도</span>
					<span style="text-align: center; font-size: 11px; font-weight: 600; color: #7c3aed"
						>둘러보기</span
					>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">다이어리</span>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">마이페이지</span>
				</footer>
			</div>
		</x-dc>
		<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
			class Component extends DCLogic {
			  renderVals() {
			    const rows = [
			      { date: '10.10', title: '제목전(展)', last: true },
			      { date: '10.10', title: '최은정 - 하늘 아래, 희망을 새기다', last: true },
			      { date: '10.10', title: 'Language of Selves-Paris Contemporary', last: true },
			      { date: '10.11', title: '혼자 보긴 아까워서', last: false },
			      { date: '10.11', title: '풍경을 담은 시선: 월전 장우성과 오늘의 한국화', last: false }
			    ];
			    // 같은 날짜가 이어지면 날짜판은 첫 줄에만, 내일 마감은 보라 점 하나로만 표시
			    return {
			      board: rows.map((r, i) => {
			        const repeat = i > 0 && rows[i - 1].date === r.date;
			        return {
			          ...r,
			          chars: repeat ? [' ', ' ', ' ', ' ', ' '] : r.date.split(''),
			          tileBg: repeat ? 'transparent' : '#292524',
			          dot: r.last ? '#AB77F1' : 'transparent'
			        };
			      })
			    };
			  }
			}
		</script>
	</body>
</html>
