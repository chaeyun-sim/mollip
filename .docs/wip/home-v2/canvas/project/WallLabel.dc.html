<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<title>홈 C 벽 레이블</title>
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<link
					rel="stylesheet"
					href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&amp;display=swap"
				/>
				<style>
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/7977b3ca42ace65d7e67bd031fe90ded') format('opentype');
						font-weight: 400;
					}
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/8f065eca601ce3cb85348621e7b4c825') format('opentype');
						font-weight: 500;
					}
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/7a9653a1bcd0948efd3d3730b1362841') format('opentype');
						font-weight: 600;
					}
					body {
						margin: 0;
					}
					a {
						color: #1c1917;
						text-decoration: none;
					}
					a:hover {
						color: #57534e;
					}
				</style>
			</helmet>
			<div
				style="
					width: 390px;
					height: 844px;
					box-sizing: border-box;
					background: #f8f6f2;
					color: #1c1917;
					font-family: 'Pretendard', sans-serif;
					position: relative;
					display: flex;
					flex-direction: column;
					overflow: hidden;
				"
			>
				<header
					style="
						display: flex;
						justify-content: space-between;
						align-items: center;
						padding: 56px 24px 0 24px;
					"
				>
					<div
						style="
							font-family: 'Hahmlet', serif;
							font-weight: 700;
							font-size: 26px;
							letter-spacing: -0.5px;
						"
					>
						mollip
					</div>
					<div style="display: flex; gap: 16px">
						<button
							aria-label="북마크"
							style="
								width: 44px;
								height: 44px;
								border: 0;
								background: transparent;
								padding: 0;
								display: flex;
								align-items: center;
								justify-content: center;
							"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#1C1917"
								stroke-width="1.6"
							>
								<path d="M6 3h12v18l-6-4-6 4z" />
							</svg>
						</button>
						<button
							aria-label="알림"
							style="
								width: 44px;
								height: 44px;
								border: 0;
								background: transparent;
								padding: 0;
								display: flex;
								align-items: center;
								justify-content: center;
							"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#1C1917"
								stroke-width="1.6"
							>
								<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z" />
								<path d="M10 21h4" />
							</svg>
						</button>
					</div>
				</header>

				<p
					style="
						margin: 28px 24px 0 24px;
						font-family: 'Hahmlet', serif;
						font-weight: 600;
						font-size: 24px;
						line-height: 34px;
					"
				>
					이번 주,<br />벽에 걸린 전시들
				</p>

				<div style="margin: 24px 24px 0 24px; display: flex; flex-direction: column; gap: 14px">
					<sc-for list="{{labels}}" as="label" hint-placeholder-count="5">
						<a
							href="#"
							style="
								display: flex;
								gap: 14px;
								align-items: flex-start;
								padding-top: 14px;
								border-top: 0.5px solid #d6d3ce;
							"
						>
							<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
								<span
									style="
										font-family: 'Hahmlet', serif;
										font-weight: 600;
										font-size: 18px;
										line-height: 25px;
									"
									>{{label.title}}</span
								>
								<span style="font-size: 13px; color: #57534e">{{label.venue}}</span>
								<span style="font-size: 12px; color: #78716c">{{label.meta}}</span>
							</span>
							<span
								style="font-size: 12px; font-weight: 600; color: {{label.tagColor}}; padding-top: 4px"
								>{{label.tag}}</span
							>
						</a>
					</sc-for>
				</div>

				<button
					style="
						position: absolute;
						right: 24px;
						bottom: 100px;
						height: 52px;
						padding: 0 20px;
						border: 0;
						border-radius: 999px;
						background: #1c1917;
						color: #ffffff;
						font-family: 'Pretendard', sans-serif;
						font-size: 15px;
						font-weight: 600;
						display: flex;
						align-items: center;
						gap: 8px;
						box-shadow: 0 6px 14px rgba(28, 25, 23, 0.28);
					"
				>
					<svg
						width="20"
						height="20"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#FFFFFF"
						stroke-width="1.8"
					>
						<path d="M4 8h3l2-3h6l2 3h3v11H4z" />
						<circle cx="12" cy="13" r="3.5" />
					</svg>
					AI 도슨트
				</button>

				<footer
					style="
						position: absolute;
						left: 0;
						right: 0;
						bottom: 0;
						height: 84px;
						background: #ffffff;
						border-top: 0.5px solid #e7e5e4;
						display: grid;
						grid-template-columns: repeat(5, minmax(0, 1fr));
						padding-top: 12px;
						box-sizing: border-box;
					"
				>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">전시</span>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">지도</span>
					<span style="text-align: center; font-size: 11px; font-weight: 600; color: #7c3aed"
						>둘러보기</span
					>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">다이어리</span>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">마이페이지</span>
				</footer>
			</div>
		</x-dc>
		<script
			type="text/x-dc"
			data-dc-script
			data-props='{"accent":{"editor":"color","default":"#7C3AED","options":["#7C3AED","#1C1917","#B45309"]},"$preview":{"width":390,"height":844}}'
		>
			class Component extends DCLogic {
			  renderVals() {
			    const accent = this.props.accent ?? '#7C3AED';
			    const closing = { tagColor: accent };
			    const calm = { tagColor: '#78716C' };
			    return {
			      labels: [
			        { ...closing, title: '혼자 보긴 아까워서', venue: '경기도박물관, 2026', meta: '기증 특별전 · 6.18 – 10.11', tag: 'D-2' },
			        { ...closing, title: '제목전(展)', venue: '한국영화박물관, 2026', meta: '기획전 · 5.8 – 10.10', tag: 'D-1' },
			        { ...calm, title: '장-프랑수아 라리유 : Coexistence', venue: '예술의전당 한가람미술관, 2026', meta: '원화 특별전 · 10.4 – 10.24', tag: '새로 열림' },
			        { ...calm, title: '조은 원화전: 오늘의 정원', venue: '그라운드 시소 이스트, 2026', meta: '원화전 · 7.17 –', tag: '인기' },
			        { ...calm, title: '세상은 어떻게 읽히는가', venue: '부산현대미술관, 2026', meta: '기획전 · 12.11 개막', tag: '예정' }
			      ]
			    };
			  }
			}
		</script>
	</body>
</html>
