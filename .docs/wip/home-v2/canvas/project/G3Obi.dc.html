<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<title>홈 G3 서점 띠지</title>
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<link
					rel="stylesheet"
					href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&amp;display=swap"
				/>
				<style>
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/7977b3ca42ace65d7e67bd031fe90ded') format('opentype');
						font-weight: 400;
					}
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/8f065eca601ce3cb85348621e7b4c825') format('opentype');
						font-weight: 500;
					}
					@font-face {
						font-family: 'Pretendard';
						src: url('/_blob/7a9653a1bcd0948efd3d3730b1362841') format('opentype');
						font-weight: 600;
					}
					body {
						margin: 0;
					}
					a {
						color: #1c1917;
						text-decoration: none;
					}
					a:hover {
						color: #57534e;
					}
				</style>
			</helmet>
			<div
				style="
					width: 390px;
					height: 844px;
					box-sizing: border-box;
					background: #f8f6f2;
					color: #1c1917;
					font-family: 'Pretendard', sans-serif;
					position: relative;
					display: flex;
					flex-direction: column;
					overflow: hidden;
				"
			>
				<header
					style="
						display: flex;
						justify-content: space-between;
						align-items: center;
						padding: 56px 20px 0 24px;
					"
				>
					<div
						style="
							font-family: 'Hahmlet', serif;
							font-weight: 700;
							font-size: 26px;
							letter-spacing: -0.5px;
						"
					>
						mollip
					</div>
					<div style="display: flex; gap: 8px">
						<button
							aria-label="북마크"
							style="
								width: 44px;
								height: 44px;
								border: 0;
								background: transparent;
								padding: 0;
								display: flex;
								align-items: center;
								justify-content: center;
							"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#1C1917"
								stroke-width="1.6"
							>
								<path d="M6 3h12v18l-6-4-6 4z" />
							</svg>
						</button>
						<button
							aria-label="알림"
							style="
								width: 44px;
								height: 44px;
								border: 0;
								background: transparent;
								padding: 0;
								display: flex;
								align-items: center;
								justify-content: center;
							"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#1C1917"
								stroke-width="1.6"
							>
								<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z" />
								<path d="M10 21h4" />
							</svg>
						</button>
					</div>
				</header>

				<a
					href="#"
					style="
						margin: 22px auto 0 auto;
						width: 236px;
						display: flex;
						flex-direction: column;
						align-items: center;
					"
				>
					<span
						style="
							width: 236px;
							height: 300px;
							position: relative;
							overflow: hidden;
							background: #9ed3e6;
							box-shadow:
								0 16px 30px rgba(28, 25, 23, 0.2),
								0 2px 4px rgba(28, 25, 23, 0.12);
						"
					>
						<span
							style="
								position: absolute;
								left: 0;
								right: 0;
								top: 0;
								bottom: 110px;
								display: flex;
								align-items: center;
								justify-content: center;
								font-size: 11px;
								color: #1c1917;
							"
							>[포스터]</span
						>
						<span
							style="
								position: absolute;
								left: 0;
								right: 0;
								bottom: 0;
								height: 110px;
								background: #f8f6f2;
								border-top: 1.5px solid #1c1917;
								box-sizing: border-box;
								padding: 14px 16px;
								display: flex;
								flex-direction: column;
								gap: 6px;
							"
						>
							<span
								style="
									font-family: 'Hahmlet', serif;
									font-weight: 700;
									font-size: 21px;
									line-height: 27px;
								"
								>이틀 뒤면<br />볼 수 없어요</span
							>
							<span style="font-size: 10.5px; color: #78716c"
								>채윤님이 저장한 전시 · 경기도박물관</span
							>
						</span>
					</span>
					<span
						style="
							margin-top: 16px;
							font-family: 'Hahmlet', serif;
							font-weight: 600;
							font-size: 17px;
							text-align: center;
						"
						>혼자 보긴 아까워서</span
					>
					<span style="margin-top: 4px; font-size: 12px; color: #78716c">2026.06.18 – 10.11</span>
				</a>

				<div
					style="
						margin: 26px 24px 0 24px;
						display: flex;
						justify-content: space-between;
						align-items: flex-end;
						border-bottom: 1px solid #1c1917;
						padding-bottom: 8px;
					"
				>
					<span style="font-family: 'Hahmlet', serif; font-weight: 600; font-size: 17px"
						>같은 서가의 전시</span
					>
					<a href="#" style="font-size: 12.5px; color: #57534e">전체</a>
				</div>
				<div style="margin: 14px 0 0 24px; display: flex; gap: 14px">
					<sc-for list="{{shelf}}" as="b" hint-placeholder-count="3">
						<a
							href="#"
							style="width: 104px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px"
						>
							<span
								style="width: 104px; height: 132px; position: relative; overflow: hidden; background: {{b.thumb}}; box-shadow: 0 6px 12px rgba(28,25,23,0.14)"
							>
								<span
									style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: #F8F6F2; border-top: 1px solid #1C1917; box-sizing: border-box; padding: 6px 7px; font-family: 'Hahmlet', serif; font-weight: 700; font-size: 11px; line-height: 15px; color: {{b.bandColor}}"
									>{{b.band}}</span
								>
							</span>
							<span style="font-size: 12px; font-weight: 500; line-height: 16px">{{b.title}}</span>
						</a>
					</sc-for>
				</div>

				<button
					style="
						position: absolute;
						right: 20px;
						bottom: 100px;
						height: 52px;
						padding: 0 20px;
						border: 0;
						border-radius: 999px;
						background: #1c1917;
						color: #ffffff;
						font-family: 'Pretendard', sans-serif;
						font-size: 15px;
						font-weight: 600;
						display: flex;
						align-items: center;
						gap: 8px;
						box-shadow: 0 6px 14px rgba(28, 25, 23, 0.28);
					"
				>
					<svg
						width="20"
						height="20"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#FFFFFF"
						stroke-width="1.8"
					>
						<path d="M4 8h3l2-3h6l2 3h3v11H4z" />
						<circle cx="12" cy="13" r="3.5" />
					</svg>
					AI 도슨트
				</button>

				<footer
					style="
						position: absolute;
						left: 0;
						right: 0;
						bottom: 0;
						height: 84px;
						background: #ffffff;
						border-top: 0.5px solid #e7e5e4;
						display: grid;
						grid-template-columns: repeat(5, minmax(0, 1fr));
						padding-top: 12px;
						box-sizing: border-box;
					"
				>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">전시</span>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">지도</span>
					<span style="text-align: center; font-size: 11px; font-weight: 600; color: #7c3aed"
						>둘러보기</span
					>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">다이어리</span>
					<span style="text-align: center; font-size: 11px; color: #a8a29e">마이페이지</span>
				</footer>
			</div>
		</x-dc>
		<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
			class Component extends DCLogic {
			  renderVals() {
			    return {
			      shelf: [
			        { thumb: '#2F6FB7', band: '내일이 마지막', bandColor: '#7C3AED', title: '제목전(展)' },
			        { thumb: '#8FA68A', band: '취향 저격 한국화', bandColor: '#1C1917', title: '풍경을 담은 시선' },
			        { thumb: '#B9B4AC', band: '12월에 열려요', bandColor: '#1C1917', title: '세상은 어떻게 읽히는가' }
			      ]
			    };
			  }
			}
		</script>
	</body>
</html>
