<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<style>
			@font-face {
				font-family: Pretendard;
				src: url('../../../assets/fonts/Pretendard-Regular.otf');
			}
			@font-face {
				font-family: Pretendard;
				src: url('../../../assets/fonts/Pretendard-Bold.otf');
				font-weight: 700;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #fff;
				font-family: Pretendard, Arial, sans-serif;
				color: #1c1917;
			}
			.phone {
				width: 390px;
				height: 844px;
				background: white;
				position: relative;
				overflow: hidden;
			}
			.status {
				height: 36px;
				padding: 10px 24px;
				font-weight: 700;
				font-size: 14px;
			}
			.hero {
				height: 330px;
				margin: 8px 15px 0;
				border-radius: 22px;
				overflow: hidden;
				position: relative;
				background: #222;
			}
			.hero img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: center 31%;
			}
			.badge {
				position: absolute;
				top: 15px;
				left: 50%;
				transform: translateX(-50%);
				white-space: nowrap;
				background: #1c1917df;
				color: white;
				border-radius: 99px;
				padding: 7px 12px;
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 1px;
			}
			.close {
				position: absolute;
				right: 10px;
				top: 10px;
				height: 42px;
				width: 42px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: #1c1917df;
				color: white;
				font-size: 24px;
			}
			.content {
				padding: 21px 23px 0;
			}
			.title {
				text-align: center;
				font-weight: 700;
				font-size: 22px;
				letter-spacing: -0.5px;
			}
			.subtitle {
				text-align: center;
				color: #78716c;
				font-size: 13px;
				margin-top: 8px;
			}
			.benefits {
				margin: 23px 12px 0;
				display: grid;
				gap: 12px;
				font-size: 13px;
				color: #292524;
			}
			.benefit {
				display: flex;
				gap: 13px;
			}
			.benefit b {
				font-size: 17px;
				font-weight: 400;
			}
			.plans {
				display: flex;
				gap: 8px;
				margin-top: 29px;
			}
			.plan {
				height: 94px;
				border: 1px solid #e7e5e4;
				border-radius: 12px;
				flex: 1;
				padding: 10px 9px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.plan.selected {
				border: 1.5px solid #7c3aed;
				background: #f3ecfd;
			}
			.planhead {
				display: flex;
				justify-content: space-between;
				font-size: 12px;
				font-weight: 700;
			}
			.circle {
				color: #c7c3bd;
			}
			.selected .circle {
				color: #7c3aed;
			}
			.price {
				font-size: 15px;
				font-weight: 700;
				white-space: nowrap;
			}
			.price small {
				font-weight: 400;
				font-size: 10px;
				color: #78716c;
			}
			.detail {
				font-size: 9px;
				color: #57534e;
				margin-top: 4px;
				white-space: nowrap;
			}
			.footer {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				border-top: 1px solid #e7e5e4;
				background: #fff;
				text-align: center;
				padding: 12px 24px 18px;
			}
			.terms {
				font-size: 11px;
				color: #292524;
				margin-bottom: 9px;
			}
			.button {
				height: 50px;
				background: #7c3aed;
				color: #fff;
				border-radius: 12px;
				display: grid;
				place-items: center;
				font-size: 14px;
				font-weight: 700;
			}
			.links {
				display: flex;
				justify-content: center;
				gap: 18px;
				margin-top: 16px;
				font-size: 10px;
				color: #78716c;
			}
		</style>
	</head>
	<body>
		<main class="phone">
			<div class="status">9:41</div>
			<div class="hero">
				<img src="../../../assets/images/genres/paintings-pearl-vertical.jpg" />
				<div class="badge">✦ &nbsp; MOLLIP PREMIUM</div>
				<div class="close">×</div>
			</div>
			<div class="content">
				<div class="title">작품을 더 깊이 만나는 방법</div>
				<div class="subtitle">몰립 프리미엄으로 전시의 여운을 오래 간직하세요</div>
				<div class="benefits">
					<div class="benefit"><b>✓</b>작품을 따라 듣는 몰입 모드</div>
					<div class="benefit"><b>✓</b>저장한 오디오 다시 듣기</div>
					<div class="benefit"><b>✓</b>나만의 작품 해설 만들기</div>
				</div>
				<div class="plans">
					<div class="plan">
						<div class="planhead">1일 <span class="circle">○</span></div>
						<div>
							<div class="price">₩2,990<small>/일</small></div>
							<div class="detail">자동 갱신 없음</div>
						</div>
					</div>
					<div class="plan selected">
						<div class="planhead">1주 <span class="circle">●</span></div>
						<div>
							<div class="price">₩6,990<small>/주</small></div>
							<div class="detail">3일 무료 체험 예정</div>
						</div>
					</div>
					<div class="plan">
						<div class="planhead">1달 <span class="circle">○</span></div>
						<div>
							<div class="price">₩14,900<small>/월</small></div>
							<div class="detail">자동 갱신</div>
						</div>
					</div>
				</div>
			</div>
			<div class="footer">
				<div class="terms">3일 무료 체험 예정 · 이후 ₩6,990/주 자동 갱신</div>
				<div class="button">결제 기능 준비 중</div>
				<div class="links">
					<span>구입 복원 준비 중</span><span>이용약관</span><span>개인정보 처리방침</span>
				</div>
			</div>
		</main>
	</body>
</html>
